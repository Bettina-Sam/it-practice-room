  if(!n){prog=`<p class="muted">${esc(once("empty",()=>pick(p.empty)))}</p>`;}
  else{
    const best=Math.max(...d.attempts.map(a=>a.pct));
    const recent=d.attempts.slice(0,5);const avg=Math.round(recent.reduce((s,a)=>s+a.pct,0)/recent.length);
    let sw=WEEK_NUMS.find(w=>d.best[w]==null), sb=null;
    if(sw==null){sw=WEEK_NUMS.reduce((m,w)=>d.best[w]<d.best[m]?w:m,WEEK_NUMS[0]);sb=d.best[sw];}
    prog=`<div class="stats"><div class="stat"><b>${n}</b><span>Practice tests</span></div><div class="stat"><b>${best}%</b><span>Best score</span></div><div class="stat"><b>${avg}%</b><span>Recent average</span></div></div>

      <section><h2 class="sec-title">Your progress</h2><div class="panel">${prog}</div></section>
    </div>

function selectionIds(){
  const st=S.setup;
  if(st.type==="week") return WEEKS[st.weeks[0]].q.map((_,i)=>`w${st.weeks[0]}q${i+1}`);
  let pool = st.type==="random" ? ALL.map(q=>q.id) : ALL.filter(q=>st.weeks.includes(q.week)).map(q=>q.id);
  return shuffle(pool).slice(0,Math.min(st.count,pool.length));
}
function setupInfo(){
  const st=S.setup; let covers,count,ok=true;
  if(st.type==="week"){covers=`Week ${st.weeks[0]}`;count=WEEKS[st.weeks[0]].q.length;}
  else if(st.type==="mixed"){const ws=st.weeks.slice().sort((a,b)=>a-b);covers=ws.length?"Weeks "+ws.join(", "):"Pick weeks";const pool=ALL.filter(q=>ws.includes(q.week)).length;count=Math.min(st.count,pool);ok=ws.length>=2;}
  else{covers="All weeks";count=st.count;}
  return {covers,count,ok,time:st.study?"No timer":`${count} min`};
}

  const st=S.setup, d=load(S.person), info=setupInfo();

    + Object.keys(UPCOMING).map(w=>`<button class="wk" disabled><span class="wtop"><b>Week ${w}</b></span><span class="wt">Coming soon</span></button>`).join("");
  const counts=[10,15,20,30].map(c=>`<button class="cnt" aria-pressed="${st.count===c}" data-act="count" data-v="${c}">${c}</button>`).join("");
  return `<main class="wrap"><h1 class="page-title">Set up your practice</h1><p class="page-sub">Multiple choice, 1 mark per question, no negative marking.<br><span class="bit">${esc(once("setup",()=>pick(me().setup)))}</span></p>

    <div class="step"><h2>1. Practice type</h2><div class="choices">
      ${typeBtn("week","Week-wise","One week at a time, like the weekly assignment.")}

      ${typeBtn("random","Random","Questions drawn from every week.")}</div></div>
    ${st.type!=="random"?`<div class="step"><h2>2. ${st.type==="week"?"Choose a week":"Choose your weeks"}</h2><div class="weeks">${weekCards}</div></div>`:""}
    ${st.type!=="week"?`<div class="step"><h2>${st.type==="random"?"2":"3"}. How many questions?</h2><div class="counts">${counts}</div></div>`:""}
    <div class="step"><h2>${st.type==="week"?"3":st.type==="random"?"3":"4"}. Mode</h2><div class="choices two">
      <button class="choice" aria-pressed="${!st.study}" data-act="mode" data-v="exam"><b>Exam mode</b><span>Timed, like NPTEL. Answers and commentary at the end.</span></button>
      <button class="choice" aria-pressed="${st.study}" data-act="mode" data-v="study"><b>Study mode</b><span>No timer. See the answer and get roasted (or praised) right away.</span></button></div></div>
  </div>

    ${info.ok?"":`<p class="hint">Pick at least two weeks for a mixed practice.</p>`}

}

function noteHTML(q){return q.uk?`<p class="ukey">No official answer key was shown for this week, so this answer was worked out separately. Double-check it against the slides.</p>`:"";}
function figHTML(){
  return `<div class="fig" role="img" aria-label="Diagram: input signal to sensor, to an unknown block, to actuator, to output signal"><span class="fs">Input signal</span><span class="fa"></span><span class="fb">Sensor</span><span class="fa"></span><span class="fb q">?</span><span class="fa"></span><span class="fb">Actuator</span><span class="fa"></span><span class="fs">Output signal</span></div>
  <p class="figcap">The sensor and the ? block make up the transducer's input side. The ? block and the actuator make up its output side.</p>`;
}

function vExam(){
  const ex=S.exam, i=ex.idx, q=BY[ex.ids[i]], a=ex.ans[i], n=ex.ids.length;
  const answered=ex.ans.filter(x=>x!==null).length;
  const locked=ex.study&&a!==null;
  const opts=q.opts.map((o,k)=>{
    let cls="opt",mark="";
    if(locked){ if(k===q.ans){cls+=" right";mark="Correct answer";} else if(k===a){cls+=" wrong";mark="Your answer";} }
    else if(a===k) cls+=" sel";
    return `<button class="${cls}" role="radio" aria-checked="${a===k}" data-act="opt" data-i="${k}" ${locked?"disabled":""}><span class="ol">${L[k]}.</span><span class="od">${esc(o)}</span>${mark?`<span class="om">${mark}</span>`:""}</button>`;
  }).join("");
  let fb="";
  if(locked){const ok=a===q.ans;
    fb=`<div class="feedback ${ok?"ok":"bad"}" aria-live="polite"><p class="quip">${esc(ex.quip[i])}</p><p><b>Why:</b> ${esc(q.why)}</p><p class="ref">From Week ${q.week}: ${esc(q.ref)}</p>${noteHTML(q)}</div>`;}
  const pal=ex.ids.map((id,k)=>{
    let c="pb";const ans=ex.ans[k]!==null, mk=ex.marked[k];
    if(ex.study&&ans) c+= ex.ans[k]===BY[id].ans?" ans":" wr";
    else if(ans&&mk) c+=" ansmk"; else if(mk) c+=" mk"; else if(ans) c+=" ans";
    if(k===i) c+=" cur";
    return `<button class="${c}" data-act="nav" data-i="${k}" aria-label="Question ${k+1}">${k+1}</button>`;}).join("");
  const legend=ex.study
    ?`<li><i style="background:var(--ok);border-color:var(--ok)"></i>Correct</li><li><i style="background:var(--bad);border-color:var(--bad)"></i>Wrong</li><li><i></i>Not answered yet</li>`
    :`<li><i style="background:var(--ok);border-color:var(--ok)"></i>Answered</li><li><i></i>Not answered</li><li><i style="background:var(--mark);border-color:var(--mark)"></i>Marked for review</li><li><i style="background:var(--mark);border-color:var(--mark);box-shadow:inset 0 0 0 2px var(--ok)"></i>Answered and marked</li>`;
  const left=ex.limit?Math.max(0,ex.limit-Math.floor((Date.now()-ex.start)/1000)):0;
  return `<main class="wrap">
    <div class="panel exam-top"><div><h1>${esc(ex.label)}</h1><span class="muted small">${answered} of ${n} answered</span><span class="bit tmsg" id="tmsg">${ex.limit&&left<=60?esc(ex.tmsg||(ex.tmsg=pick(me().timer))):""}</span></div>
      <div style="display:flex;gap:10px;align-items:center">${ex.limit?`<div class="timer ${left<=60?"low":""}"><small>Time left</small><b id="tleft">${mmss(left)}</b></div>`:""}<button class="btn primary" data-act="submit">${ex.study?"Finish":"Submit"}</button></div></div>
    <div class="exam-grid"><section class="panel">
      <div class="qhead"><h2>Question ${i+1} <span class="muted" style="font-weight:500">of ${n}</span></h2><span class="tag">Week ${q.week}</span></div>
      <p class="qtext">${esc(q.text)}</p>${q.fig?figHTML():""}
      <div class="opts" role="radiogroup">${opts}</div>${fb}
      <div class="qnav">
        <button class="btn" data-act="prev" ${i===0?"disabled":""}>Previous</button>
        ${ex.study?"":`<button class="btn" data-act="mark">${ex.marked[i]?"Unmark":"Mark for review"}</button><button class="btn ghost" data-act="clear" ${a===null?"disabled":""}>Clear response</button>`}
        <span class="grow"></span>
        <button class="btn primary" data-act="next">${i===n-1?(ex.study?"Finish":"Save and submit"):(ex.study?"Next":"Save and next")}</button>
      </div>
      <p class="keys">Shortcuts: <kbd>a</kbd>–<kbd>d</kbd> pick an option, <kbd>←</kbd> <kbd>→</kbd> move${ex.study?"":", <kbd>m</kbd> mark"}</p>
    </section>
    <aside class="panel palette"><h2>Question palette</h2><div class="pal">${pal}</div><ul class="legend">${legend}</ul><p class="pnote"><b>Tip:</b> ${esc(ex.tip[i]||(ex.tip[i]=deck("tips")))}</p></aside></div></main>`;
}

function vConfirm(){
  const ex=S.exam, n=ex.ids.length, ans=ex.ans.filter(x=>x!==null).length, mk=ex.marked.filter(Boolean).length;
  return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${ex.study?"Finish this practice?":"Submit your practice?"}</h2>
    <ul><li><b>${ans}</b> answered</li><li><b>${n-ans}</b> not answered</li>${ex.study?"":`<li><b>${mk}</b> marked for review</li>`}</ul>
    <p class="muted small">Unanswered questions score 0. You can't change answers after this.</p><p class="bit">${esc(once("confirm",()=>pick(me().confirm)))}</p>
    <div class="row"><button class="btn" data-act="keep">Keep working</button><button class="btn primary" data-act="confirmSubmit">${ex.study?"Finish":"Submit"}</button></div></div></div>`;
}

function bracket(r){if(r.c+r.w===0)return"blank";return r.pct>=90?"top":r.pct>=70?"good":r.pct>=40?"mid":"low";}
function vResult(){
  const r=S.result, p=me(), b=once("res",()=>pick(p.res[bracket(r)]));
  const C=2*Math.PI*52, off=C*(1-r.pct/100);
  const missed=r.ids.filter((id,k)=>r.ans[k]!==BY[id].ans).length;
  const stood=[];
  if(r.pct===100) stood.push(once("perfect",()=>pick(p.perfect)));
  if(r.s>0) stood.push(`${r.s} question${r.s>1?"s were":" was"} left blank. There's no negative marking, so an educated guess can only help.`);
  if(r.weeks.length>1&&r.w+r.s>0){
    const miss={};r.ids.forEach((id,k)=>{if(r.ans[k]!==BY[id].ans){const w=BY[id].week;miss[w]=(miss[w]||0)+1;}});
    const top=Object.keys(miss).sort((x,y)=>miss[y]-miss[x])[0];
    stood.push(`Most misses came from Week ${top} (${WEEKS[top].t.toLowerCase()}): ${miss[top]} of them.`);
  }
  if(r.limit){ stood.push(r.auto?"Time ran out before you submitted.":`You finished with ${dur(Math.max(0,r.limit-r.secs))} to spare.`); }
  const counts={all:r.n,wrong:r.w,skip:r.s,right:r.c};
  const chip=(v,t)=>`<button class="chip" aria-pressed="${S.filter===v}" data-act="filter" data-v="${v}">${t} (${counts[v]})</button>`;
  const cards=r.ids.map((id,k)=>{
    const q=BY[id], a=r.ans[k], st=a===null?"skip":a===q.ans?"ok":"bad";
    const fk={ok:"right",bad:"wrong",skip:"skip"}[st];
    if(S.filter!=="all"&&S.filter!==fk) return "";
    const opts=q.opts.map((o,j)=>{let cls="opt",m="";if(j===q.ans){cls+=" right";m="Correct answer";}else if(j===a){cls+=" wrong";m="Your answer";}
      return `<div class="${cls}"><span class="ol">${L[j]}.</span><span class="od">${esc(o)}</span>${m?`<span class="om">${m}</span>`:""}</div>`;}).join("");
    const verdict=st==="ok"?`<p class="verdict ok">Correct, 1 mark</p>`:st==="bad"?`<p class="verdict bad">Not quite, 0 marks. Correct answer: ${L[q.ans]}</p>`:`<p class="verdict skip">Skipped, 0 marks. Correct answer: ${L[q.ans]}</p>`;
    return `<article class="panel rq"><div class="qhead"><h3 style="font-size:17px">Question ${k+1} <span class="muted" style="font-weight:500">Week ${q.week}</span></h3><span class="status ${st}">${st==="ok"?"Correct":st==="bad"?"Wrong":"Not attempted"}</span></div>
      <p class="qtext" style="font-size:16.5px">${esc(q.text)}</p>${q.fig?figHTML():""}<div class="opts">${opts}</div>${verdict}
      <p class="why"><b>Why:</b> ${esc(q.why)}</p><p class="ref">From Week ${q.week}: ${esc(q.ref)}</p>${noteHTML(q)}</article>`;}).join("");
  return `<main class="wrap">
    <section class="hero"><div class="rhero">
      <div class="ring" role="img" aria-label="${r.pct} percent"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b>${r.pct}%</b></div>
      <div class="rtext"><p class="meta">${esc(r.label)}, ${dur(r.secs)}${r.limit?` of ${dur(r.limit)}`:""}${r.study?", study mode":""}</p><h1>${esc(nm(b[0]))}</h1><p>${esc(b[1])}</p>
        <p style="margin-top:8px">You scored <b>${r.c} out of ${r.n}</b>.</p>
        <div class="actions" style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">${missed?`<button class="btn" style="background:#fff;color:var(--accent);border:0" data-act="retry">Retry the ${missed} you missed</button>`:""}<button class="btn light" data-act="newExam">New practice</button><button class="btn light" data-act="home">Home</button></div></div>
    </div></section>
    <div class="tiles"><div class="tile ok"><b>${r.c}</b><span>Correct</span><em>${esc(p.tiles.ok)}</em></div><div class="tile bad"><b>${r.w}</b><span>Wrong</span><em>${esc(p.tiles.bad)}</em></div><div class="tile mid"><b>${r.s}</b><span>Not attempted</span><em>${esc(p.tiles.skip)}</em></div><div class="tile"><b>${dur(r.secs)}</b><span>Time taken</span><em>${esc(p.tiles.time)}</em></div></div>
    ${stood.length?`<section class="panel stood"><h2 class="sec-title" style="margin:0">What stood out</h2><ul>${stood.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></section>`:""}
    <div class="rev-head"><div><h2 class="sec-title" style="margin:0">Review your answers</h2><span class="bit">${esc(once("review",()=>pick(p.review)))}</span></div><div class="chips">${chip("all","All")}${chip("wrong","Wrong")}${chip("skip","Not attempted")}${chip("right","Correct")}</div></div>
    ${cards||`<div class="panel empty">Nothing in this filter.</div>`}
  </main>`;
}

function render(){
  document.documentElement.style.setProperty("--accent",VOICE.accent);
  const v={pick:vPick,home:vHome,setup:vSetup,exam:vExam,result:vResult}[S.screen]();
  $app.innerHTML=vHeader()+v+(S.screen!=="exam"?`<footer class="foot"><figure class="hodnote"><blockquote>Keep learning, keep growing. Your IT family is with you every step of the way 💙</blockquote><figcaption><b>Head of the Department </b><span>Department of Information Technology, FXEC</span></figcaption></figure><p class="small">${esc(VOICE.footQuips[Math.floor(Date.now()/864e5)%VOICE.footQuips.length])}<br>Questions from the NPTEL assignments, July to October 2026.</p></footer>`:"")+(S.confirm&&S.exam?vConfirm():"");
}

/* ---------- exam engine ---------- */
function startExam(ids,label,study,single){
  stopTimer();
  const n=ids.length;
  S.exam={ids,label,study,single:single||null,ans:Array(n).fill(null),marked:Array(n).fill(false),quip:Array(n).fill(""),tip:Array(n).fill(""),idx:0,start:Date.now(),limit:study?0:n*60};
  S.confirm=false;
  if(!study) S.timer=setInterval(tick,1000);
  go("exam");
}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
function tick(){
  const ex=S.exam;if(!ex||!ex.limit)return;
  const left=Math.max(0,ex.limit-Math.floor((Date.now()-ex.start)/1000));
  const el=document.getElementById("tleft");
  if(el){el.textContent=mmss(left);el.parentElement.classList.toggle("low",left<=60);}
  const tm=document.getElementById("tmsg");if(tm&&left<=60&&!tm.textContent)tm.textContent=ex.tmsg||(ex.tmsg=pick(me().timer));
  if(left<=0) finish(true);
}
function choose(k){
  const ex=S.exam,i=ex.idx;
  if(k>=BY[ex.ids[i]].opts.length) return;
  if(ex.study&&ex.ans[i]!==null) return;
  ex.ans[i]=k;
  if(ex.study) ex.quip[i]=deck(k===BY[ex.ids[i]].ans?"right":"wrong");
  render();
}
function finish(auto){
  const ex=S.exam;if(!ex)return;stopTimer();
  let secs=Math.round((Date.now()-ex.start)/1000);if(ex.limit)secs=Math.min(secs,ex.limit);
  let c=0,w=0,s=0;ex.ids.forEach((id,k)=>{const a=ex.ans[k];if(a===null)s++;else if(a===BY[id].ans)c++;else w++;});
  const n=ex.ids.length,pct=Math.round(100*c/n);
  const r={label:ex.label,ids:ex.ids,ans:ex.ans,c,w,s,n,pct,secs,limit:ex.limit,study:ex.study,auto:!!auto,date:Date.now(),weeks:[...new Set(ex.ids.map(id=>BY[id].week))]};
  const d=load(S.person);d.last=r;
  d.attempts.unshift({date:r.date,label:r.label,c,w,s,n,pct,secs});d.attempts=d.attempts.slice(0,40);
  if(ex.single!=null) d.best[ex.single]=Math.max(d.best[ex.single]??0,pct);
  save(S.person,d);
  S.result=r;S.exam=null;S.confirm=false;S.filter="all";go("result");
  if(pct>=80&&r.c>0) confetti();
}

/* ---------- actions ---------- */
const A={
  install:async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;render();},
  hideInstall:()=>{S.hideInstall=true;render();},
  theme:()=>{const n=isDark()?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("iiot-dept-theme",n);}catch(e){}render();},
  begin:()=>{const v=(document.getElementById("nameIn")||{}).value||"";userName=v.trim().slice(0,24);try{localStorage.setItem("iiot-dept-name",userName);localStorage.setItem("iiot-dept-started","1");}catch(e){}S.person="learner";go("home");},
  skipName:()=>{userName="";try{localStorage.setItem("iiot-dept-name","");localStorage.setItem("iiot-dept-started","1");}catch(e){}S.person="learner";go("home");},
  rename:()=>go("pick"),
  home:()=>go("home"),
  toSetup:()=>go("setup"),
  nextLine:()=>{S.c.line=deck("mix");render();},
  seeResult:()=>{S.result=load(S.person).last;S.filter="all";go("result");},
  clearHist:()=>{if(!S.clearArm){S.clearArm=true;render();return;}save(S.person,{attempts:[],best:{},last:null});S.clearArm=false;render();},
  quickWeek:d=>{S.setup.type="week";S.setup.weeks=[+d.w];go("setup");},
  type:d=>{S.setup.type=d.v;if(d.v==="week")S.setup.weeks=[S.setup.weeks[0]||1];render();},
  week:d=>{const w=+d.w,st=S.setup;if(st.type==="week")st.weeks=[w];else st.weeks=st.weeks.includes(w)?st.weeks.filter(x=>x!==w):[...st.weeks,w];render();},
  count:d=>{S.setup.count=+d.v;render();},
  mode:d=>{S.setup.study=d.v==="study";render();},
  start:()=>{const st=S.setup,info=setupInfo();if(!info.ok)return;
    const label=st.type==="week"?`Week ${st.weeks[0]}`:st.type==="mixed"?`Mixed: Weeks ${st.weeks.slice().sort((a,b)=>a-b).join(", ")}`:`Random ${info.count}`;
    startExam(selectionIds(),label,st.study,st.type==="week"?st.weeks[0]:null);},
  opt:d=>choose(+d.i),
  nav:d=>{S.exam.idx=+d.i;render();},
  prev:()=>{if(S.exam.idx>0){S.exam.idx--;render();}},
  next:()=>{const ex=S.exam;if(ex.idx<ex.ids.length-1){ex.idx++;render();}else{S.confirm=true;render();}},
  mark:()=>{const ex=S.exam;ex.marked[ex.idx]=!ex.marked[ex.idx];render();},
  clear:()=>{const ex=S.exam;ex.ans[ex.idx]=null;render();},
  submit:()=>{S.confirm=true;render();},
  keep:()=>{S.confirm=false;render();},
  confirmSubmit:()=>finish(false),
  retry:()=>{const r=S.result;const ids=r.ids.filter((id,k)=>r.ans[k]!==BY[id].ans);startExam(shuffle(ids),`Retry: ${ids.length} missed`,r.study,null);},
  newExam:()=>go("setup"),
  filter:d=>{S.filter=d.v;render();}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset);}});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target&&e.target.id==="nameIn"){A.begin();return;}
  if(S.screen!=="exam"||!S.exam||e.ctrlKey||e.metaKey||e.altKey)return;
  if(S.confirm){if(e.key==="Escape")A.keep();return;}
  const k=e.key.toLowerCase();
  if("abcd".includes(k)&&k.length===1){choose("abcd".indexOf(k));}
  else if(e.key==="ArrowRight"){if(S.exam.idx<S.exam.ids.length-1){S.exam.idx++;render();}}
  else if(e.key==="ArrowLeft"){A.prev();}
  else if(k==="m"&&!S.exam.study){A.mark();}
});

/* ---------- confetti ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=document.createElement("canvas");cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60";
  document.body.appendChild(cv);const ctx=cv.getContext("2d");const W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cols=[VOICE.accent,"#f2b134","#ffffff","#5bc0a8","#b9a6f0"];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3,heart:Math.random()<.25}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;
    if(p.heart){ctx.font=`${p.r*3}px serif`;ctx.fillText("★",0,0);}else ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});
    if(++t<150)requestAnimationFrame(f);else cv.remove();})();
}

if(S.person) S.screen="home";
render();
</script></body></html>
